plugins {
    id 'com.android.application'
}

// Elke GitHub-build krijgt een hoger versienummer.
def run = (System.getenv('GITHUB_RUN_NUMBER') ?: '1').toInteger()
// Ophogen als de Android-schil verandert (Java, manifest, rechten); anders komt nieuwe code niet bij de gebruiker.
def nativeVersion = file('../native_version.txt').text.trim().toInteger()
// Publieke sleutel waarmee de app updates controleert.
def updatePubkey = file('../update_key.pem').text.replaceAll(/-----[A-Z ]+-----/, '').replaceAll(/\s/, '')
def keystorePath = System.getenv('POULE_KEYSTORE')

android {
    namespace 'nl.wouter.poule'
    compileSdk 34

    defaultConfig {
        applicationId 'nl.wouter.poule'
        minSdk 24
        targetSdk 34
        versionCode run
        versionName "0.2.${run}"
        buildConfigField 'int', 'NATIVE_VERSION', "${nativeVersion}"
        buildConfigField 'String', 'UPDATE_PUBKEY', "\"${updatePubkey}\""
        buildConfigField 'String', 'UPDATE_BASE', '"https://raw.githubusercontent.com/Woetoe/poule-app/uitgifte/"'
        buildConfigField 'String', 'VERSION_PREFIX', '"0.2."'
    }

    buildFeatures {
        buildConfig true
    }

    signingConfigs {
        // De sleutel staat niet in de repo maar als geheim POULE_SLEUTEL in GitHub.
        poule {
            if (keystorePath) {
                storeFile file(keystorePath)
                storeType 'pkcs12'
                storePassword 'poule-sleutel'
                keyAlias 'poule'
                keyPassword 'poule-sleutel'
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig keystorePath ? signingConfigs.poule : null
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}
